<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tempo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(55 42% 93%);
        color: hsl(55 24% 15%);
        font-family: -apple-system, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      p { max-width: 340px; line-height: 1.5; font-size: 15px; }
    </style>
  </head>
  <body>
    <!-- Shown only if the Tempo server is unreachable. Normally Capacitor
         loads the app from server.url in capacitor.config.ts. -->
    <p>
      Tempo can't reach its server. Start it with <b>npm run dev</b> and check
      TEMPO_SERVER_URL in capacitor.config.ts, then relaunch.
    </p>
  </body>
</html>
